<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="skGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c21" />
      <stop offset="100%" stop-color="#0e0e11" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#darkBg)" stroke="url(#skGlow)" stroke-width="2.5" class="favicon-border" />
  
  <!-- Active Developer Status Indicator Dot (Pulsing Green) -->
  <circle cx="49" cy="15" r="3.5" fill="#22c55e" class="status-pulse" />

  <!-- Monogram Logo -->
  <text 
    x="32" 
    y="40" 
    text-anchor="middle" 
    class="favicon-text"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
    font-size="24" 
    font-weight="900" 
    letter-spacing="-1px"
  >SK</text>

  <style>
    .favicon-text {
      fill: #ffffff;
      animation: textShimmer 3.5s ease-in-out infinite alternate;
    }

    .status-pulse {
      animation: pulseDot 1.8s ease-in-out infinite;
      transform-origin: 49px 15px;
    }

    .favicon-border {
      animation: borderGlow 4s ease-in-out infinite alternate;
    }

    @keyframes textShimmer {
      0% { fill: #f4f4f5; filter: drop-shadow(0 0 1px rgba(255,255,255,0.3)); }
      50% { fill: #ffffff; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.75)); }
      100% { fill: #f4f4f5; filter: drop-shadow(0 0 1px rgba(255,255,255,0.3)); }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    @keyframes borderGlow {
      0% { stroke-opacity: 0.7; }
      100% { stroke-opacity: 1; filter: drop-shadow(0 0 3px rgba(168, 85, 247, 0.5)); }
    }

    @media (prefers-color-scheme: light) {
      .favicon-border {
        fill: #0f172a;
      }
      .favicon-text {
        fill: #ffffff;
      }
    }
  </style>
</svg>
