<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="meshGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGlowRight" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#meshGlow)" />
  <rect width="1200" height="630" fill="url(#meshGlowRight)" />

  <!-- Outer Card Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#12131a" fill-opacity="0.6" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Brand Pill -->
  <g transform="translate(80, 85)">
    <rect width="210" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#34d399" />
    <text x="36" y="24" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SK BUILDS PORTFOLIO</text>
  </g>

  <!-- Availability Badge (Top Right) -->
  <g transform="translate(830, 85)">
    <rect width="290" height="38" rx="19" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="4.5" fill="#10b981" />
    <text x="34" y="23" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="13" font-weight="600">Available for Contract &amp; Architecture</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 210)">
    <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Sunil Khobragade
    </text>
    <text x="0" y="52" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.2">
      Senior Full-Stack Developer &amp; Solutions Architect
    </text>
    <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="19" font-weight="400">
      Distributed Systems • High-Throughput Microservices • Cloud &amp; AI Architectures
    </text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(80, 420)">
    <!-- Pill 1: Node.js / TS -->
    <g transform="translate(0, 0)">
      <rect width="145" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="20" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">⚡ Node.js / TS</text>
    </g>

    <!-- Pill 2: React / Next.js -->
    <g transform="translate(160, 0)">
      <rect width="165" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="20" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">⚛️ React / Next.js</text>
    </g>

    <!-- Pill 3: Laravel / Django -->
    <g transform="translate(340, 0)">
      <rect width="180" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="20" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">🐘 Laravel &amp; Python</text>
    </g>

    <!-- Pill 4: AWS & Docker -->
    <g transform="translate(535, 0)">
      <rect width="160" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="20" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">☁️ AWS &amp; Docker</text>
    </g>

    <!-- Pill 5: Microservices & Redis -->
    <g transform="translate(710, 0)">
      <rect width="210" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="20" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">🚀 Microservices &amp; Redis</text>
    </g>
  </g>

  <!-- Bottom Footer Line inside Card -->
  <g transform="translate(80, 525)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      🌐 sk-builds.vercel.app &bull; Hyderabad, India &bull; sunilkhobragade@proton.me
    </text>
    <text x="1040" y="0" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
      Explore Projects &amp; Tech Articles &rarr;
    </text>
  </g>
</svg>
